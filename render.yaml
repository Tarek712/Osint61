services:
  - type: web
    name: osint-raw-military-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash-lite"
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: POLL_INTERVAL_AVIATION
        value: "180"
      - key: POLL_INTERVAL_SEISMIC
        value: "180"
      - key: POLL_INTERVAL_THERMAL
        value: "300"
      - key: POLL_INTERVAL_NGA
        value: "600"
